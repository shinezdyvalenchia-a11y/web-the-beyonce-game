<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beyonce Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(ellipse at bottom, #111d2e 0%, #050608 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #ffffff;
        }

        /* DYNAMIC MOVING STARS CANVAS */
        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* CONTENT CONTAINER */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 16px;
        }

        /* TITLE 1: "The Beyonce Game Has Come" (WHITE GLOWING FONT) */
        .title-main {
            font-family: 'Cinzel', serif;
            font-size: clamp(28px, 5vw, 56px);
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 35px rgba(255, 255, 255, 0.8), 0 0 50px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        /* TITLE 2: "release on 20 desember" (WHITE GLOWING FONT - APPEARS IN 2s) */
        .release-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(18px, 3.5vw, 32px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 30px rgba(255, 255, 255, 0.8);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .release-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- DYNAMIC MOVING STARS CANVAS -->
    <canvas id="starCanvas"></canvas>

    <!-- CONTENT (NO LOGO & NO LOGIN BUTTON) -->
    <div class="content-container">
        <h1 class="title-main">The Beyonce Game Has Come</h1>
        <div class="release-text" id="releaseText">release on 20 desember</div>
    </div>

    <script>
        // ====================================================
        // DYNAMIC MOVING STARFIELD ANIMATION
        // ====================================================
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        const NUM_STARS = 250;
        const stars = [];

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < NUM_STARS; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speedY: Math.random() * 0.8 + 0.2,
                    speedX: (Math.random() - 0.5) * 0.2,
                    opacity: Math.random() * 0.8 + 0.2,
                    pulseSpeed: Math.random() * 0.03 + 0.005,
                    pulseDir: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];

                // Move stars vertically
                s.y -= s.speedY;
                s.x += s.speedX;

                // Wrap around edges
                if (s.y < 0) s.y = height;
                if (s.y > height) s.y = 0;
                if (s.x < 0) s.x = width;
                if (s.x > width) s.x = 0;

                // Twinkle / Pulse opacity
                s.opacity += s.pulseSpeed * s.pulseDir;
                if (s.opacity >= 1) {
                    s.opacity = 1;
                    s.pulseDir = -1;
                } else if (s.opacity <= 0.15) {
                    s.opacity = 0.15;
                    s.pulseDir = 1;
                }

                // Render star dot
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                ctx.shadowBlur = s.size > 1.5 ? 8 : 0;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
            }

            requestAnimationFrame(drawStars);
        }

        initStars();
        drawStars();

        // ====================================================
        // TIMING: 2 DETIK KEMUDIAN MUNCUL "release on 20 desember"
        // ====================================================
        setTimeout(() => {
            const releaseEl = document.getElementById('releaseText');
            if (releaseEl) releaseEl.classList.add('visible');
        }, 2000); // 2000 ms = 2 Detik
    </script>
</body>
</html>
